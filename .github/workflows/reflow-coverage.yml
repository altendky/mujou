name: Coverage

on:
  workflow_call:

jobs:
  check:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      # Node.js is required by build.rs to compile Tailwind CSS via
      # npx @tailwindcss/cli.  See: https://github.com/altendky/mujou/issues/12
      - run: npm ci

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          target: wasm32-unknown-unknown

      # TODO: Upload lcov.info to Codecov once coverage reporting is set up.
      #   See: docs/src/project/open-questions.md (Deferred > Infrastructure > Coverage reporting)
      - name: Generate coverage
        run: cargo llvm-cov nextest --all-features --workspace --no-tests=warn --lcov --output-path lcov.info
