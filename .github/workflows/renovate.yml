name: Renovate

on:
  schedule:
    # 08:00 and 20:00 UTC: 4 AM/PM EDT, 3 AM/PM EST.
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug logging
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app-token.outputs.token }}
          docker-user: 12021:0
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          # Only the configured mise tools may be re-locked, for all supported platforms.
          RENOVATE_ALLOWED_COMMANDS: '["^mise lock (node|python|pipx:pre-commit|aqua:rust-lang/mdBook|aqua:rustwasm/wasm-pack|aqua:taiki-e/cargo-llvm-cov|aqua:EmbarkStudios/cargo-deny|github:nextest-rs/nextest|github:DioxusLabs/dioxus) --platform linux-arm64,linux-x64,macos-arm64,macos-x64,windows-x64$"]'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          # Also preserve platform coverage in Renovate's built-in mise lock invocation.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_LOCKFILE_PLATFORMS":"linux-arm64,linux-x64,macos-arm64,macos-x64,windows-x64"}'
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
