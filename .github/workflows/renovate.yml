name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@8d75b92f43899d483728e9a8a7fd44238020f6e6 # v46.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          docker-user: 12021:0
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          # Only the configured mise tools may be re-locked, for all supported platforms.
          RENOVATE_ALLOWED_COMMANDS: '["^mise lock (node|python|pre-commit|aqua:rust-lang/mdBook|aqua:rustwasm/wasm-pack|aqua:taiki-e/cargo-llvm-cov|aqua:EmbarkStudios/cargo-deny|github:nextest-rs/nextest|github:DioxusLabs/dioxus) --platform linux-arm64,linux-x64,macos-arm64,macos-x64,windows-x64$"]'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          # Also preserve platform coverage in Renovate's built-in mise lock invocation.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_LOCKFILE_PLATFORMS":"linux-arm64,linux-x64,macos-arm64,macos-x64,windows-x64"}'
